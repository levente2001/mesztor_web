<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Termékkezelés – MESZ-TOR Admin</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--primary:#c86904;--dark:#33291f;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#f6f7fa;font:14px Montserrat,Arial;color:#252525}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.top b{font-size:17px}.top a{color:var(--primary);text-decoration:none}.container{max-width:1180px;padding:24px;margin:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 22px #11182709;margin-bottom:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.danger{color:#b91c1c}.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form label{display:block;font-weight:600;font-size:13px}.form input,.form select,.form textarea,.search{width:100%;margin-top:7px;border-radius:10px;border:1px solid #d7dce3;background:#fff;padding:11px}.form{display:grid;gap:16px}.wide{grid-column:1/-1}.product{display:grid;grid-template-columns:64px 1fr auto;gap:15px;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.product img{width:64px;height:64px;object-fit:cover;border-radius:12px}.placeholder{display:grid;place-items:center;width:64px;height:64px;border-radius:12px;background:#f5e7d8;font-size:26px}.mini{font-size:12px}.tag{color:#a15d0b;font-weight:700}.actions{display:flex;gap:8px}.alert{border-radius:10px;padding:14px;background:#fff2de;color:#78450a;line-height:1.6}.preview{height:96px;width:140px;object-fit:cover;border:1px solid var(--line);border-radius:12px}.login{max-width:460px;margin:10vh auto}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.product{grid-template-columns:48px 1fr}.actions{grid-column:2}.container{padding:12px}.panel{padding:16px}.wide{grid-column:auto}}
</style></head><body>
<div class="top"><b>MESZ-TOR Admin · Termékkezelés</b><div class="bar"><a href="./admin.html">← Admin főoldal</a><a href="./shop.html" target="_blank">Webshop ↗</a><button class="btn hidden" id="logout">Kijelentkezés</button></div></div>
<main class="container"><div id="loginPanel" class="panel login"><h2>Admin belépés</h2><p class="muted">Csak jóváhagyott adminfiókkal használható.</p><form id="loginForm" class="form"><label>E-mail<input type="email" id="email" required autocomplete="username"></label><label>Jelszó<input type="password" id="password" required autocomplete="current-password"></label><button type="submit" class="btn primary">Belépés</button><div id="loginError" class="muted"></div></form></div>
<div id="app" class="hidden"><div class="bar"><div><h1>Termékek</h1><p class="muted">Kosaras és ajánlatkéréses termékek kezelése, a meglévő weboldal módosítása nélkül.</p></div><button class="btn primary" id="newProduct">+ Új termék</button></div><section class="panel"><input class="search" id="filter" placeholder="Keresés név vagy cikkszám alapján..."><div id="list"></div></section>
<section class="panel hidden" id="editor"><div class="bar"><h2 id="editorTitle">Új termék</h2><button class="btn" id="cancel">Bezárás</button></div><form id="form" class="form"><div class="grid"><label>Termék neve *<input id="name" maxlength="180" required></label><label>Cikkszám<input id="sku" maxlength="90"></label><label>Kategória<input id="category" maxlength="100" placeholder="pl. Távirányítók"></label><label>Terméktípus<select id="mode"><option value="purchase">Közvetlen rendelés (kosár)</option><option value="quote">Ajánlatkérés</option></select></label><label>Ár (Ft, kosaras terméknél kötelező)<input id="price" type="number" min="0" step="1"></label><label>Készlet (db, üres = korlátlan / nem kezelt)<input id="stock" type="number" min="0" step="1"></label><label class="wide">Rövid leírás<textarea id="description" rows="4" maxlength="3000"></textarea></label><label class="wide">Termékfotó feltöltése (max. 5 MB)<input type="file" id="image" accept="image/png,image/jpeg,image/webp"></label><div class="wide"><img id="preview" class="preview hidden" alt="Termékkép előnézet"><p class="mini muted">A képet Firebase Storage tárolja. Ajánlott: 1200 × 900 px, JPG vagy WebP.</p></div><label><input type="checkbox" id="active" checked> Aktív – látható a webshopban</label></div><div class="bar"><button type="submit" class="btn primary" id="save">Termék mentése</button><span id="status" class="muted"></span></div></form></section></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,get,set,remove,push}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getStorage,ref as storageRef,uploadBytes,getDownloadURL,deleteObject}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const cfg={apiKey:"AIzaSyAZUGCJkn9L4xH_M8L0fZYTUresZ9qYPqo",authDomain:"flymeto-696d0.firebaseapp.com",databaseURL:"https://flymeto-696d0-default-rtdb.europe-west1.firebasedatabase.app",projectId:"flymeto-696d0",storageBucket:"flymeto-696d0.firebasestorage.app",messagingSenderId:"651204605205",appId:"1:651204605205:web:d5dfbf3698be7ac6ee251c"};
const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app),storage=getStorage(app),$=x=>document.getElementById(x);
let products={},editing=null,authorized=false;
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="Ellenőrzés...";try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch{ $("loginError").textContent="Nem sikerült a belépés. Ellenőrizze a megadott adatokat." }};
$("logout").onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{authorized=false;$("app").classList.add("hidden");$("logout").classList.add("hidden");$("loginPanel").classList.remove("hidden");if(!user)return;try{const snap=await get(ref(db,"admins/"+user.uid));if(!snap.exists()||snap.val()!==true){$("loginError").textContent="Ez a fiók nem rendelkezik adminjogosultsággal.";return}authorized=true;$("app").classList.remove("hidden");$("loginPanel").classList.add("hidden");$("logout").classList.remove("hidden");$("loginError").textContent="";await load()}catch(e){$("loginError").textContent="Adminjogosultság nem ellenőrizhető. Ellenőrizze az adatbázis szabályait.";console.error(e)}});
async function load(){const snap=await get(ref(db,"shop/products"));products=snap.val()||{};render()}
function render(){const q=$("filter").value.toLowerCase();const rows=Object.entries(products).filter(([id,p])=>(p.name+" "+(p.sku||"")).toLowerCase().includes(q));$("list").innerHTML=rows.length?rows.map(([id,p])=>'<div class="product">'+(p.imageUrl?'<img src="'+safe(p.imageUrl)+'" alt="">':'<div class="placeholder">⚙</div>')+'<div><b>'+safe(p.name)+'</b><div class="mini muted">'+safe(p.sku||"Nincs cikkszám")+' · '+safe(p.category||"Egyéb")+' · '+(p.mode==="quote"?"Ajánlatkérés":Number(p.price||0).toLocaleString("hu-HU")+" Ft")+'</div><div class="mini tag">'+(p.active===false?"Rejtett":"Aktív")+'</div></div><div class="actions"><button class="btn" data-edit="'+safe(id)+'">Szerkesztés</button><button class="btn danger" data-delete="'+safe(id)+'">Törlés</button></div></div>').join(""):'<p class="muted">Nincs találat. Hozza létre az első terméket!</p>'}
$("filter").oninput=render;
function edit(id){editing=id;const p=products[id]||{};$("editor").classList.remove("hidden");$("editorTitle").textContent=id?"Termék szerkesztése":"Új termék";for(const k of ["name","sku","category","description","price","stock"])$(k).value=p[k]??"";$("mode").value=p.mode||"purchase";$("active").checked=p.active!==false;$("image").value="";$("preview").src=p.imageUrl||"";$("preview").classList.toggle("hidden",!p.imageUrl);$("status").textContent="";$("editor").scrollIntoView({behavior:"smooth"})}
$("newProduct").onclick=()=>edit(null);$("cancel").onclick=()=>$("editor").classList.add("hidden");
$("image").onchange=()=>{const file=$("image").files?.[0];if(file){$("preview").src=URL.createObjectURL(file);$("preview").classList.remove("hidden")}};
$("list").onclick=async e=>{const ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(ed){edit(ed.dataset.edit);return}if(del&&authorized){const id=del.dataset.delete,p=products[id];if(!confirm("Biztosan törli a következő terméket: "+p.name+"?"))return;try{await remove(ref(db,"shop/products/"+id));if(p.imagePath){try{await deleteObject(storageRef(storage,p.imagePath))}catch(e){console.warn("Régi termékkép törlése sikertelen",e)}}delete products[id];render()}catch(e){alert("A törlés sikertelen. Ellenőrizze a jogosultságokat.");console.error(e)}}};
$("form").onsubmit=async e=>{e.preventDefault();if(!authorized)return;const mode=$("mode").value,price=$("price").value,stock=$("stock").value;if(mode==="purchase"&&price===""){alert("A közvetlenül rendelhető terméknél adjon meg árat.");return}const btn=$("save");btn.disabled=true;$("status").textContent="Mentés...";try{const id=editing||push(ref(db,"shop/products")).key,old=products[id]||{};let imageUrl=old.imageUrl||"",imagePath=old.imagePath||"";const file=$("image").files?.[0];if(file){if(file.size>5*1024*1024||!["image/png","image/jpeg","image/webp"].includes(file.type))throw Error("Maximum 5 MB méretű JPG, PNG vagy WebP kép tölthető fel.");const extension=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";imagePath="shop/products/"+id+"/"+Date.now()+"."+extension;const target=storageRef(storage,imagePath);await uploadBytes(target,file,{contentType:file.type});imageUrl=await getDownloadURL(target)}const data={name:$("name").value.trim(),sku:$("sku").value.trim(),category:$("category").value.trim(),description:$("description").value.trim(),mode,price:mode==="purchase"?Number(price):null,stock:stock===""?null:Number(stock),active:$("active").checked,imageUrl,imagePath,updatedAt:Date.now(),createdAt:old.createdAt||Date.now()};await set(ref(db,"shop/products/"+id),data);products[id]=data;editing=id;render();$("status").textContent="Sikeresen mentve!";$("editor").classList.add("hidden")}catch(err){$("status").textContent=err.message||"Mentési hiba.";console.error(err)}finally{btn.disabled=false}};
</script></body></html>
